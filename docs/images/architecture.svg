<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260">
  <rect width="920" height="260" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Box 1: Chrome Extension MV3 -->
  <g transform="translate(24, 34)">
    <rect width="230" height="192" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="230" height="36" rx="12" fill="#EFF6FF"/>
    <text x="115" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">Chrome MV3 Bridge</text>
    <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• Real-time tab delta events</text>
    <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• Multi-profile &amp; multi-window</text>
    <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• Live page screenshot capture</text>
    <text x="20" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• OffscreenCanvas downscaling</text>
    <rect x="20" y="154" width="190" height="24" rx="6" fill="#F1F5F9"/>
    <text x="115" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">ws://127.0.0.1:17384</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="258" y1="130" x2="334" y2="130" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="334,125 344,130 334,135" fill="#2563EB"/>
  <text x="301" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#2563EB">0ms Push</text>

  <!-- Box 2: In-Memory Store & Nucleo Matcher -->
  <g transform="translate(348, 34)">
    <rect width="230" height="192" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="230" height="36" rx="12" fill="#EFF6FF"/>
    <text x="115" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">Rust Daemon State</text>
    <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• MRU-sorted TabStore</text>
    <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• Nucleo fuzzy matcher (&lt;0.2ms)</text>
    <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• Pre-decoded BGRA GPU atlas</text>
    <text x="20" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• YouTube thumbnail resolver</text>
    <rect x="20" y="154" width="190" height="24" rx="6" fill="#F1F5F9"/>
    <text x="115" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">CGEventTap (⌘` / ⌥`)</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="582" y1="130" x2="656" y2="130" stroke="#2563EB" stroke-width="2"/>
  <polygon points="656,125 666,130 656,135" fill="#2563EB"/>
  <text x="624" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#2563EB">&lt;2ms Paint</text>

  <!-- Box 3: GPUI + Metal NSPanel -->
  <g transform="translate(670, 34)">
    <rect width="226" height="192" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect width="226" height="36" rx="11" fill="#2563EB"/>
    <text x="113" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">GPUI + Metal NSPanel</text>
    <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• Pre-warmed 120Hz Metal surface</text>
    <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• 3×2 Visual Screenshot Grid</text>
    <text x="18" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• Auto-Compact on Search</text>
    <text x="18" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• Continuous Scrollbar</text>
    <rect x="18" y="154" width="190" height="24" rx="6" fill="#EFF6FF"/>
    <text x="113" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#1D4ED8">orderFrontRegardless</text>
  </g>
</svg>
