<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glowSearch" cx="30%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelShadow2" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.52"/>
    </filter>
  </defs>

  <rect width="960" height="390" rx="18" fill="url(#bgGrad2)"/>
  <rect width="960" height="390" rx="18" fill="url(#glowSearch)"/>

  <!-- Frosted Daylight Panel in Compact Search Mode (5 matches -> height = 48 + 5*42 + 16 = 274) -->
  <g transform="translate(48, 52)" filter="url(#panelShadow2)">
    <rect width="864" height="278" rx="16" fill="#F8FAFC" fill-opacity="0.97" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header -->
    <path d="M 0 16 Q 0 0 16 0 L 848 0 Q 864 0 864 16 L 864 48 L 0 48 Z" fill="#FFFFFF"/>
    <line x1="0" y1="48" x2="864" y2="48" stroke="#E2E8F0" stroke-width="1"/>

    <rect x="16" y="12" width="24" height="24" rx="6" fill="#EFF6FF"/>
    <text x="28" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#2563EB">⌘</text>

    <!-- Active Search Query + Cursor -->
    <text x="50" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="600" fill="#0F172A">gpui<tspan fill="#2563EB">▏</tspan></text>

    <!-- Right Header Info -->
    <rect x="618" y="13" width="82" height="22" rx="6" fill="#F1F5F9"/>
    <text x="659" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#64748B">5 / 24 tabs</text>
    <text x="708" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748B">· ↵ Switch · Esc Cancel</text>

    <!-- Row 1 (Selected) -->
    <g transform="translate(12, 58)">
      <rect width="840" height="38" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
      <rect x="12" y="7" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
      <circle cx="24" cy="19" r="6" fill="#D97706"/>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#1D4ED8"><tspan font-weight="800" fill="#2563EB">gpui</tspan>::WindowOptions — Rust Crate Documentation</text>
      <rect x="572" y="8" width="224" height="22" rx="5" fill="#DBEAFE"/>
      <text x="684" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#1E40AF">docs.rs/<tspan font-weight="700">gpui</tspan>/latest/WindowOptions</text>
      <text x="814" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#2563EB">↵</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(12, 100)">
      <rect width="840" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="12" y="7" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="17" y="14" width="14" height="10" rx="2" fill="#EF4444"/>
      <polygon points="22,16.5 26,19 22,21.5" fill="#FFFFFF"/>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#0F172A">Building a GPU-Accelerated UI in Rust with <tspan font-weight="700" fill="#2563EB">GPUI</tspan> — Deep Dive</text>
      <rect x="562" y="8" width="234" height="22" rx="5" fill="#F1F5F9"/>
      <text x="679" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748B">youtube.com/watch?v=<tspan font-weight="700" fill="#1D4ED8">gpui</tspan>-rust-2026</text>
      <text x="810" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">🔊</text>
    </g>

