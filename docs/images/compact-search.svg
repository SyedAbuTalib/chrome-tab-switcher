      <rect x="12" y="7" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="24" cy="19" r="6" fill="#F97316"/>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#0F172A">Production API Latency &amp; <tspan font-weight="700" fill="#2563EB">GPU</tspan> Frame Time — Grafana</text>
      <rect x="598" y="8" width="228" height="22" rx="5" fill="#F1F5F9"/>
      <text x="712" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748B">metrics.internal.dev/d/<tspan font-weight="700" fill="#1D4ED8">gpui</tspan>-latency</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(12, 184)">
      <rect width="840" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="12" y="7" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="24" cy="19" r="6" fill="#0F172A"/>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#0F172A">zed-industries/zed — <tspan font-weight="700" fill="#2563EB">GPUI</tspan> Metal Renderer</text>
      <rect x="568" y="8" width="258" height="22" rx="5" fill="#F1F5F9"/>
      <text x="697" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748B">github.com/zed-industries/zed/crates/<tspan font-weight="700" fill="#1D4ED8">gpui</tspan></text>
    </g>

    <!-- Row 5 -->
    <g transform="translate(12, 226)">
      <rect width="840" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="12" y="7" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="18" y="13" width="12" height="12" rx="3" fill="#2563EB"/>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#0F172A">crates.io: <tspan font-weight="700" fill="#2563EB">gpui</tspan> 0.2.2 — GPU-accelerated UI framework</text>
      <rect x="646" y="8" width="180" height="22" rx="5" fill="#F1F5F9"/>
      <text x="736" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748B">crates.io/crates/<tspan font-weight="700" fill="#1D4ED8">gpui</tspan></text>
